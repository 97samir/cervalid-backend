
spring:
  application:
    name: cervalid-api

  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  aop:
    proxy-target-class: true

server:
  port: ${SERVER_PORT:8081}

cervalid:
  demo:
    enabled: ${CERVALID_DEMO_ENABLED:false}
    password: ${CERVALID_DEMO_PASSWORD:}

app:
  superadmin:
    email: ${SUPERADMIN_EMAIL}
    password: ${SUPERADMIN_PASSWORD}

  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

  certificate:
    verification-url: /verify

  credential:
    verification-url: /verify/credential

  cookie:
    secure: false

  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000 # 1 hora
    refresh-expiration: 604800000 # 7 dias

sendgrid:
  api:
    key: ${SENDGRID_API_KEY}

blockchain:
  rpc-url: ${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
  private-key: ${BLOCKCHAIN_PRIVATE_KEY}
  contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS}
  network: ${NETWORK:ANVIL_LOCAL}

logging:
  level:
    root: INFO
