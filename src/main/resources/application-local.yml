
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

cervalid:
  demo:
    enabled: ${CERVALID_DEMO_ENABLED:true}

logging:
  level:
    root: INFO
    # Seguridad de Cervalid
    com.cervalid.platform.security: INFO
    org.springframework.security: WARN

    # Hibernate y consultas SQL
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
