# perfil de producción (HTTPS, seguridad)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
  jpa:
    show-sql: false

server:
  port: 8081
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        name: cervalid_session

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION}
  cookie-name: cervalid_token

logging:
  level:
    root: WARN
    com.cervalid: INFO
